name: Run Hermes Agent

on:
  workflow_dispatch:

jobs:
  run-hermes:
    runs-on: ubuntu-latest
    environment: Secrate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent

      - name: Configure Hermes (OpenRouter with Free Nemotron 3 Super)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p ~/.hermes

          # 1. Store secrets in environment file
          cat << 'EOF' > ~/.hermes/.env
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          EOF

          # 2. Set provider and default model
          cat << 'EOF' > ~/.hermes/config.yaml
          model:
            provider: "openrouter"
            default: "nvidia/nemotron-3-super-120b-a12b:free"
          platforms:
            telegram:
              enabled: true
          EOF

      - name: Run Telegram Gateway
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -m hermes gateway telegram
