name: Run Hermes Agent

on:
  workflow_dispatch:

jobs:
  run-hermes:
    runs-on: ubuntu-latest
    environment: Secrate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Hermes (OpenRouter & Model)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p ~/.hermes

          # 1. Store secrets in .env
          cat << 'EOF' > ~/.hermes/.env
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          EOF

          # 2. Configure model and provider in config.yaml
          cat << 'EOF' > ~/.hermes/config.yaml
          model:
            provider: "openrouter"
            default: "anthropic/claude-3.5-sonnet"
          platforms:
            telegram:
              enabled: true
          EOF

      - name: Run Telegram Gateway
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Starts the gateway process and keeps the GitHub Action runner active
          hermes gateway run telegram
